networks:
  frappe-platform-net:
    name: ${DOCKER_NETWORK_NAME:-frappe-platform-net}

volumes:
  postgres_data:
  mariadb_data:
  nginx_conf:
  upload_staging:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [frappe-platform-net]

  platform-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [frappe-platform-net]

  mariadb:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      # Default (16M) is too small for restoring real-world dumps with large
      # attachment blobs — `bench restore` fails mid-way with "Server has
      # gone away" / "Got a packet bigger than 'max_allowed_packet' bytes".
      - --max_allowed_packet=512M
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [frappe-platform-net]

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://platform-redis:6379/0
      CELERY_RESULT_BACKEND: redis://platform-redis:6379/1
      MARIADB_HOST: mariadb
    depends_on:
      postgres:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - upload_staging:/app/upload_staging
    networks: [frappe-platform-net]
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_admin &&
             gunicorn platform_api.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  worker:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://platform-redis:6379/0
      CELERY_RESULT_BACKEND: redis://platform-redis:6379/1
      MARIADB_HOST: mariadb
    depends_on:
      postgres:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nginx_conf:/nginx_conf
      - upload_staging:/app/upload_staging
    networks: [frappe-platform-net]
    command: celery -A platform_api worker -l info --concurrency=4

  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    # Fixed name so the API/worker can reach this container deterministically
    # (e.g. to trigger `nginx -s reload`) regardless of the Compose project name.
    container_name: frappe-platform-proxy
    ports:
      - "80:80"
    volumes:
      - nginx_conf:/etc/nginx/conf.d/sites
    depends_on:
      - api
    networks: [frappe-platform-net]
