worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    # 0 = unlimited. Site restore uploads (SQL dumps, attachment zips) can
    # legitimately be large; this is a trusted single-admin tool, so there's
    # nothing meaningful being defended against by capping it.
    client_max_body_size 0;

    # Docker's embedded DNS. Combined with a variable in proxy_pass (below),
    # this makes nginx re-resolve container hostnames per-request instead of
    # caching whatever IP they had when nginx last started/reloaded —
    # otherwise any container restart (new IP) breaks routing until the next
    # unrelated reload.
    resolver 127.0.0.11 valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Platform UI + API. Anything whose Host header doesn't match a
    # site-specific server block (below) lands here.
    server {
        listen 80 default_server;
        server_name platform.localhost localhost;

        root /usr/share/nginx/html;
        index index.html;

        # A brand-new custom domain has no site-specific server block yet
        # (see api/sites/nginx_config.py) — its first-ever ACME HTTP-01
        # challenge request lands here by default-server fallback, before
        # certbot has anything to give it its own block for. Subsequent
        # renewals are served by the site's own block instead, which
        # carries the same location.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            # No path after the variable: this is nginx's documented
            # "proxy_pass without a URI" form, which forwards the original
            # request URI unchanged. (A path suffix here is silently
            # dropped once the target is a variable, which would otherwise
            # send every request to the same fixed path.)
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # One file per active Frappe/ERPNext site, regenerated by the platform's
    # Celery worker whenever a site or bench is created/deleted. Routes each
    # site's Host header to its own bench container (see
    # api/sites/nginx_config.py).
    include /etc/nginx/conf.d/sites/*.conf;
}
